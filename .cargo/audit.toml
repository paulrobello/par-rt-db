# cargo-audit configuration (SEC-202). The three vulnerability ignores this
# file carried (RUSTSEC-2023-0071 rsa Marvin, RUSTSEC-2026-0387 crypto-bigint
# timing, RUSTSEC-2026-0459 libsqlite3-sys SQLite CVE) all cleared with the
# jsonwebtoken 12 / sqlx 0.9.1 bumps on 2026-11-20; only the two
# unmaintained-informational ignores below remain.
#
# RUSTSEC-2026-0543 / RUSTSEC-2026-0555 — chrono 0.4.45 and chrono-tz 0.10.4
# flagged unmaintained (informational, not a vulnerability; no fixed release
# exists upstream — both are the max-stable versions). chrono is load-bearing
# (document timestamps, TTL arithmetic, cron schedules). Re-evaluate when a
# maintained successor or new-maintainer release lands.
[advisories]
ignore = [
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]
