services:
  postgres:
    image: pgvector/pgvector:pg17
    # The parallel test suite opens many concurrent pools across ~20 test
    # binaries; the default max_connections=100 is exhausted under full `cargo
    # test` load, surfacing as transient create_database/insert failures (the
    # scheduled_test timer-harness flake). 300 is a comfortable dev ceiling.
    command: postgres -c max_connections=300
    ports:
      - "127.0.0.1:55434:5432"
    environment:
      POSTGRES_USER: rtdb
      POSTGRES_PASSWORD: rtdb
      POSTGRES_DB: rtdb
      # Deterministic, versionless collation: `C` collate never carries a libc
      # version, so the cluster is immune to the collation-version-mismatch
      # warning across image/base-OS glibc upgrades (en_US.utf8 drifts with
      # glibc and warns). ctype=C.UTF-8 keeps UTF-8 charset handling. Applied
      # only on a fresh (empty) data volume.
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C.UTF-8"
    volumes:
      - rtdb-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtdb"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  rtdb-dev-pg:
