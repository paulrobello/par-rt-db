[project]
name = "par-rt-db"
version = "0.1.0"
description = "Python client for par-rt-db (self-hosted realtime document database)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Paul Robello", email = "probello@gmail.com"}]
dependencies = ["pydantic>=2.13.4,<3"]

[project.optional-dependencies]
ws = ["websockets>=17.0.1"]  # added in Plan 2
http = ["httpx>=0.28.1"]     # sync + async HTTP/admin/storage client (http_client + admin + aio_http_client)
aio = ["par-rt-db[http]"]    # alias for [http] (ARC-124): async surface no longer needs a separate dep

[dependency-groups]
# `dev` is a default group — `uv run` / `uv sync` installs it automatically, so
# `make checkall` works from a clean checkout without a prior `make install`.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "pyright>=1.1.411",
    "pdoc>=16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/par_rt_db"]

[tool.hatch.build.targets.wheel.force-include]
# ENH-028 phase 2: the shared query-combination rule table lives in the repo's
# wire-corpus (single source of truth for all five runners); force-included
# here so `importlib.resources` can load it from an installed wheel without a
# duplicated copy drifting from the canonical file.
"../wire-corpus/query-combinations.json" = "par_rt_db/_data/query-combinations.json"

[tool.hatch.build.targets.sdist.force-include]
# Mirrors the wheel force-include above, but into the src tree itself so the
# file travels inside the sdist tarball (no `../wire-corpus` to reach once
# unpacked). Note: this repo has no PyPI publish pipeline and `make checkall`
# never builds a wheel or sdist for python-client (verified 2026-08-25) — a
# hypothetical wheel-built-from-this-sdist step would still need its own
# `../wire-corpus` reach and isn't covered; `uv build --wheel` from a checkout
# (the case that matters) works, verified directly.
"../wire-corpus/query-combinations.json" = "src/par_rt_db/_data/query-combinations.json"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live-server integration tests (set RTDB_TEST_SERVER_URL + RTDB_TEST_ADMIN_KEY)",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
# QA-003: incrementally stricter. Rules added are all clean on current code.
# Intentionally NOT enabled (would error on the ~70 deliberate `Any` usages in
# in_memory.py that mirror serde_json::Value wire shapes — see QA-004 for the
# same rationale in ts-client):
#   reportUnknownVariableType, reportUnknownArgumentType,
#   reportUnknownMemberType, reportUnknownParameterType, reportAny
# Also deferred (would fire on intentional defensive overapproximation in
# in_memory.py): reportUnreachable.
reportMissingTypeStubs = "warning"
reportDuplicateImport = "warning"
reportDeprecated = "warning"
reportUnusedImport = "warning"
# QA-203: stale-ignore detection is on — every `# type: ignore` must still be
# suppressing something real.
reportUnnecessaryTypeIgnoreComment = "error"
