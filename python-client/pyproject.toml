[project]
name = "par-rt-db"
version = "0.1.0"
description = "Python client for par-rt-db (self-hosted realtime document database)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Paul Robello", email = "probello@gmail.com"}]
dependencies = ["pydantic>=2.14.2,<3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/paulrobello/par-rt-db"
Repository = "https://github.com/paulrobello/par-rt-db"
Changelog = "https://github.com/paulrobello/par-rt-db/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# SEC-005: runtime deps carry upper bounds so a future breaking release
# cannot be resolved into a fresh install ahead of a client fix (pydantic's
# `<3` pattern). httpx is 0.x, where semver permits breaking minor bumps, so
# its cap sits at the tested minor; websockets caps at the next major.
ws = ["websockets>=17.4,<18"]  # added in Plan 2
http = ["httpx>=0.28.1,<0.29"]  # sync + async HTTP/admin/storage client (http_client + admin + aio_http_client)
aio = ["par-rt-db[http]"]    # alias for [http] (ARC-124): async surface no longer needs a separate dep

[dependency-groups]
# `dev` is a default group — `uv run` / `uv sync` installs it automatically, so
# `make checkall` works from a clean checkout without a prior `make install`.
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "pdoc>=16.0.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/par_rt_db"]

[tool.hatch.build.targets.wheel.force-include]
# ENH-028/ENH-031: keep a package-local copy of the canonical table so both
# direct wheel builds and wheels rebuilt from an sdist have the resource.
"src/par_rt_db/_data/query-combinations.json" = "par_rt_db/_data/query-combinations.json"

[tool.hatch.build.targets.sdist.force-include]
# Mirrors the wheel force-include above, but into the src tree itself so the
# file travels inside the sdist tarball (no `../wire-corpus` to reach once
# ENH-031: the release pipeline builds this sdist with `uv build` and publishes
# it to PyPI. The force-include keeps the shared rule table inside the archive,
# where the checkout-relative `../wire-corpus` path is no longer available.
"../wire-corpus/query-combinations.json" = "src/par_rt_db/_data/query-combinations.json"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live-server integration tests (set RTDB_TEST_SERVER_URL + RTDB_TEST_ADMIN_KEY)",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
# QA-003: incrementally stricter. Rules added are all clean on current code.
# Intentionally NOT enabled (would error on the ~70 deliberate `Any` usages in
# in_memory.py that mirror serde_json::Value wire shapes — see QA-004 for the
# same rationale in ts-client):
#   reportUnknownVariableType, reportUnknownArgumentType,
#   reportUnknownMemberType, reportUnknownParameterType, reportAny
# Also deferred (would fire on intentional defensive overapproximation in
# in_memory.py): reportUnreachable.
reportMissingTypeStubs = "warning"
reportDuplicateImport = "warning"
reportDeprecated = "warning"
reportUnusedImport = "warning"
# QA-203: stale-ignore detection is on — every `# type: ignore` must still be
# suppressing something real.
reportUnnecessaryTypeIgnoreComment = "error"
