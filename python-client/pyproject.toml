[project]
name = "par-rt-db"
version = "0.1.0"
description = "Python client for par-rt-db (self-hosted realtime document database)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Paul Robello", email = "probello@gmail.com"}]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
ws = ["websockets>=13"]      # added in Plan 2
http = ["httpx>=0.27"]       # added in Plan 2 (http_client + admin)
aio = ["httpx>=0.27"]        # async HTTP/admin/storage client (ENH-012)

[dependency-groups]
# `dev` is a default group — `uv run` / `uv sync` installs it automatically, so
# `make checkall` works from a clean checkout without a prior `make install`.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pyright>=1.1.350"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/par_rt_db"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live-server integration tests (set RTDB_TEST_SERVER_URL + RTDB_TEST_ADMIN_KEY)",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
