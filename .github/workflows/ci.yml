name: CI

# ARC-003: gate every change. `make checkall` is the single source of truth for
# the project's definition-of-done (fmt-check + clippy -D warnings + typecheck +
# tests across server, ts-client, rust-client, python-client, dashboard, cli).
# The Swift client's gate stays off the ubuntu image — swiftformat/swiftlint
# are brew-only there (recent ubuntu images may carry a Swift toolchain, but
# the lint pair is the decisive gap). Its Makefile lines are Darwin-guarded
# (skipped loudly here) and gated by the macOS `swift` job below instead.
on:
  push:
  pull_request:

  schedule:
    - cron: '17 4 * * 1'
# Cancel superseded runs on the same ref AND event: branch pushes and PR
# updates still supersede their own in-flight runs, but the weekly scheduled
# run (schedule event on the default branch) can no longer be cancelled by —
# nor cancel — a concurrent push run on that same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only reads the repo. Add write tokens only if a step needs them.
permissions:
  contents: read

jobs:
  checkall:
    name: make checkall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The server integration tests read RTDB_TEST_DATABASE_URL
      # (server/tests/common/mod.rs, server/tests/healthz_test.rs). The Makefile
      # exports this same default (line 2); we set it explicitly so the CI is
      # self-documenting and independent of that Makefile default. The value
      # matches what `make dev-db-up` brings up (pgvector on 127.0.0.1:55434).
      RTDB_TEST_DATABASE_URL: postgres://rtdb:rtdb@127.0.0.1:55434/rtdb

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Reclaim runner disk before the build. The full debug build of the
      # server + rust-client test graph (hundreds of `target/debug/deps`
      # artifacts) plus the `pgvector/pgvector:pg17` Docker pull exhausts the
      # ubuntu-latest root FS — observed as `rustc-LLVM ERROR: IO failure on
      # output stream: No space left on device` mid-compile (three consecutive
      # failures, 2026-08-11). ubuntu-latest ships ~5–7 GB of SDK/toolchain
      # cruft this workflow never uses (Android, .NET, CodeQL, Haskell, the
      # apt cache, stale Docker images); removing it head-of-queue prevents
      # the disk-fill. Manual `rm` (not a third-party action) to keep the
      # workflow's pinned-action discipline. `df -h` proves the reclamation.
      - name: Free runner disk space
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver \
            /usr/local/share/chrome_driver
          sudo apt-get clean
          sudo docker system prune -af --volumes || true
          df -h /

      # --- Rust (server + rust-client) -------------------------------------
      # edition = "2024" in both Cargo.tomls ⇒ requires stable ≥ 1.85.
      # ARC-120: the root `rust-toolchain.toml` is the single source of truth
      # for the channel + components, honored by the `rust:bookworm` Docker base
      # image and by rustup locally. The dtolnay action still needs an explicit
      # `toolchain:` input (it does not auto-read the file), so it is pinned to
      # `stable` here matching the file. SEC-138: the action ref is pinned to an
      # immutable master-history SHA — `6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772`
      # (master-history SHAs are the only ones dtolnay guarantees are not
      # garbage-collected). Bump deliberately: re-verify the new SHA resolves
      # and is on master.
      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      # --- Bun (ts-client + dashboard) -------------------------------------
      # `oven-sh` is the Bun team's org (the bare `oven/` org has no setup-bun
      # repo — CI failed at action resolution until this was corrected).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      # --- Python + uv (python-client) -------------------------------------
      # python-client requires Python >=3.12; uv resolves and installs it.
      # SEC-138: pinned to an immutable commit SHA. SHA =
      # 20cfd1bf945f4377ade1205e4dbc17946fc9a30d (the v10.0.1 annotated tag's
      # target, verified to resolve before pinning). Bump deliberately.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # --- First-time installs ---------------------------------------------
      # A fresh CI checkout has no node_modules, no .venv, and no ts-client/dist.
      # These three targets are NOT prerequisites of `make checkall` — the
      # Makefile assumes they have already been run once (see CLAUDE.md).
      - name: Install ts-client deps
        run: make ts-client-install

      - name: Install dashboard deps
        run: make dashboard-install

      - name: Install python-client deps
        run: make python-client-install

      # --- The gate ---------------------------------------------------------
      # `make checkall` = fmt-check + lint + typecheck + test.
      #
      # Database strategy: we deliberately do NOT use a `services:` Postgres
      # container. Instead `make checkall` → `make test` → `make dev-db-up`
      # brings up `pgvector/pgvector:pg17` on 127.0.0.1:55434 via docker compose.
      # Reasons:
      #   1. The server uses pgvector for vector search; a plain `postgres:17`
      #      service container would fail vector-search tests.
      #   2. `make test` has `dev-db-up` as a hard Make prerequisite, so the DB
      #      is started automatically and tuned (max_connections=300 for the
      #      ~20 concurrent test binaries).
      #   3. `docker compose` v2 is preinstalled on ubuntu-latest, and the
      #      dev compose file's `--wait` flag blocks until the pg_isready
      #      healthcheck passes.
      # `make typecheck` (inside checkall) depends on `ts-client-build`, so the
      # dashboard's `@par-rt-db/client` resolution from ts-client/dist is
      # satisfied automatically (gate-needs-ts-client-dist-built gotcha).
      - name: Run make checkall
        run: make checkall

      - name: Upload Rust API reference
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-api-reference
          path: target/doc

      - name: Upload TypeScript API reference
        uses: actions/upload-artifact@v7.0.1
        with:
          name: typescript-api-reference
          path: ts-client/docs-api

      - name: Upload Python API reference
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-api-reference
          path: python-client/docs-api


      # ARC-110: `make checkall` exercises rust-client only under
      # `--all-features`. This extra gate checks the library AND every test
      # target across meaningful feature combinations, so an ungated feature
      # import in a test (which would compile under --all-features and break
      # every other combo) is caught. The [[test]] required-features in
      # rust-client/Cargo.toml make the per-test gating declarative.
      - name: rust-client feature-combination gate (ARC-110)
        run: make rust-client-check-features

  proptest-weekly:
    name: property tests (1000 cases)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RTDB_TEST_DATABASE_URL: postgres://rtdb:rtdb@127.0.0.1:55434/rtdb
      PROPTEST_CASES: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Start dev database
        run: make dev-db-up
      - name: Run property tests
        run: cargo test --manifest-path server/Cargo.toml --all-features --test main proptest_parity

  # --- Swift client (macOS runner) --------------------------------------
  # `swift build`/`swift test` need the Swift 6 toolchain, which ships with the
  # Xcode on macos-latest; swiftformat/swiftlint come from Homebrew (the runner
  # image usually carries both — `brew install` is a fast no-op when it does).
  # Same pinned checkout ref as the ubuntu job (SEC-138 discipline: no
  # floating tags).
  swift:
    name: make swift-client-checkall
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install swiftformat & swiftlint
        run: brew install swiftformat swiftlint

      - name: Run make swift-client-checkall
        run: make swift-client-checkall
      - name: Generate Swift API reference
        run: make swift-client-doc

      - name: Package Swift API reference
        run: tar -czf swift-api-reference.tar.gz -C swift-client/docs-api ParRtDbClient.doccarchive

      - name: Upload Swift API reference
        uses: actions/upload-artifact@v7.0.1
        with:
          name: swift-api-reference
          path: swift-api-reference.tar.gz

  pages:
    name: Publish API references
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [checkall, swift]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Rust API reference
        uses: actions/download-artifact@v8.0.1
        with:
          name: rust-api-reference
          path: site/rust
      - name: Download TypeScript API reference
        uses: actions/download-artifact@v8.0.1
        with:
          name: typescript-api-reference
          path: site/ts
      - name: Download Python API reference
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-api-reference
          path: site/python
      - name: Download Swift API reference
        uses: actions/download-artifact@v8.0.1
        with:
          name: swift-api-reference
          path: site/swift
      - name: Unpack Swift DocC archive
        run: |
          tar -xzf site/swift/swift-api-reference.tar.gz -C site/swift
          rm site/swift/swift-api-reference.tar.gz
          cp -R site/swift/ParRtDbClient.doccarchive/. site/swift/
          rm -rf site/swift/ParRtDbClient.doccarchive
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
