name: CI

# ARC-003: gate every change. Restructured 2026-10-12 to the standard CI shape
# (job-per-concern + scoped dispatch): one job per gate concern, each composing
# the same `make` targets `make checkall` does — so the local gate and CI stay
# in parity and "re-run failed jobs" re-executes exactly the failed concern
# (a lint typo is distinguishable from a test failure at the job level).
#
#   scope       resolver: turns the workflow_dispatch `os-scope` choice into the
#               runner matrix every other job gates on (scoped dispatch — one
#               OS's legs re-trigger with a single dispatch, no push)
#   drift       env/dockerfile/backup/hostname/cli-docs drift checks
#   lint        make fmt-check lint
#   typecheck   make typecheck
#   test        make test (ubuntu — the platform-sensitive concern; the macOS
#               leg is the `swift` job below)
#   features    make rust-client-check-features (ARC-110)
#   docs        API references (rust/ts/python) — dispatch/tag only (heavy
#               artifact tiering; pages consumes them on tags)
#   swift       make swift-client-checkall (macOS leg)
#   proptest    weekly 1000-case property tests
#   deps-audit  weekly make audit-deps (ENH-051)
#   pages       tag-only publish of the API references
#
# The Swift client's gate stays off the ubuntu image — swiftformat/swiftlint
# are brew-only there (recent ubuntu images may carry a Swift toolchain, but
# the lint pair is the decisive gap). Its Makefile lines are Darwin-guarded
# (skipped loudly here) and gated by the macOS `swift` job instead.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os-scope:
        description: >-
          Runner scope to re-trigger; 'all' runs every leg. Use a single
          dispatch to verify a platform-scoped fix instead of a full run.
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest]

  schedule:
    - cron: '17 4 * * 1'

# Cancel superseded runs on PR updates only. Push and scheduled runs go to
# completion: the weekly scheduled run (schedule event on the default branch)
# can neither be cancelled by — nor cancel — a concurrent push run on the same
# ref, because the group includes the event name.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: CI only reads the repo. Add write tokens only if a step needs them.
permissions:
  contents: read

jobs:
  scope:
    name: Resolve runner scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os-matrix: ${{ steps.resolve.outputs.os-matrix }}
    steps:
      - name: Resolve os scope
        id: resolve
        run: |
          case "${{ inputs.os-scope }}" in
            all)           MATRIX='["ubuntu-latest", "macos-latest"]' ;;
            ubuntu-latest) MATRIX='["ubuntu-latest"]' ;;
            macos-latest)  MATRIX='["macos-latest"]' ;;
            # Non-dispatch events carry no input: every leg runs.
            "")            MATRIX='["ubuntu-latest", "macos-latest"]' ;;
            *) echo "unknown os-scope: ${{ inputs.os-scope }}" >&2; exit 1 ;;
          esac
          echo "os-matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "os-matrix=$MATRIX"

  drift:
    name: drift checks (env, dockerfile, backup, hostname, cli-docs)
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest')
    runs-on: ubuntu-latest
    # Per-job ceilings. Bump only with the incident run-id in a comment when a
    # ceiling has killed a real run.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      # cli-docs-check builds the cli (workspace deps included); the other four
      # checks are pure shell over committed files.
      - name: Free runner disk space
        uses: ./.github/actions/free-runner-disk

      - name: Run drift checks
        run: make env-drift-check dockerfile-stub-check backup-persistence-check hostname-leak-check cli-docs-check

  lint:
    name: make fmt-check lint
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Free runner disk space
        uses: ./.github/actions/free-runner-disk

      # --- Rust (server + rust-client) -------------------------------------
      # edition = "2024" in both Cargo.tomls ⇒ requires stable ≥ 1.85.
      # ARC-120: the root `rust-toolchain.toml` is the single source of truth
      # for the channel + components, honored by the `rust:bookworm` Docker base
      # image and by rustup locally. The dtolnay action still needs an explicit
      # `toolchain:` input (it does not auto-read the file), so it is pinned to
      # `stable` here matching the file. SEC-138: the action ref is pinned to an
      # immutable master-history SHA — `e2a55d2ffb04f378e9626c28d38b36d230d1e12f`
      # (master HEAD 2026-10-09; master-history SHAs are the only ones dtolnay
      # guarantees are not garbage-collected). Bump deliberately: re-verify the
      # new SHA resolves and is on master.
      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      # --- Bun (ts-client + dashboard) -------------------------------------
      # `oven-sh` is the Bun team's org (the bare `oven/` org has no setup-bun
      # repo — CI failed at action resolution until this was corrected).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      # --- Python + uv (python-client) -------------------------------------
      # python-client requires Python >=3.12; uv resolves and installs it.
      # SEC-138: pinned to the v10.3.0 tag's commit SHA
      # (1c37ad07a6a961277cf70c0d37d6f313000f5884, verified to resolve before
      # pinning). Bump deliberately.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --- Go (go-client) ---------------------------------------------------
      # SEC-138: setup-go pinned to the v7.0.0 tag's commit SHA
      # (b7ad1dad31e06c5925ef5d2fc7ad053ef454303e, verified to resolve before
      # pinning). The old pin was an untagged main-HEAD commit, not v5.3.0.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go-client/go.sum

      # --- First-time installs ---------------------------------------------
      # A fresh CI checkout has no node_modules, no .venv, and no Go module
      # cache. These targets are NOT prerequisites of the make gate — the
      # Makefile assumes they have already been run once (see CLAUDE.md).
      - name: Install go-client deps
        run: make go-client-install

      - name: Install ts-client deps
        run: make ts-client-install

      - name: Install dashboard deps
        run: make dashboard-install

      - name: Install python-client deps
        run: make python-client-install

      - name: Run make fmt-check lint
        run: make fmt-check lint

  typecheck:
    name: make typecheck
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # No Rust toolchain here by design (ARC-014): `make typecheck` carries the
      # non-Rust typecheckers only — clippy in the lint job already fails on
      # everything cargo check would.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go-client/go.sum

      - name: Install go-client deps
        run: make go-client-install

      - name: Install ts-client deps
        run: make ts-client-install

      - name: Install dashboard deps
        run: make dashboard-install

      - name: Install python-client deps
        run: make python-client-install

      # `make typecheck` depends on `ts-client-build`, so the dashboard's
      # `@par-rt-db/client` resolution from ts-client/dist is satisfied
      # automatically (gate-needs-ts-client-dist-built gotcha).
      - name: Run make typecheck
        run: make typecheck

  test:
    name: make test
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The server integration tests read RTDB_TEST_DATABASE_URL
      # (server/tests/common/mod.rs, server/tests/healthz_test.rs). The Makefile
      # exports this same default (line 2); we set it explicitly so the CI is
      # self-documenting and independent of that Makefile default. The value
      # matches what `make dev-db-up` brings up (pgvector on 127.0.0.1:55434).
      RTDB_TEST_DATABASE_URL: postgres://rtdb:rtdb@127.0.0.1:55434/rtdb

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Free runner disk space
        uses: ./.github/actions/free-runner-disk

      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go-client/go.sum

      - name: Install go-client deps
        run: make go-client-install

      - name: Install ts-client deps
        run: make ts-client-install

      - name: Install dashboard deps
        run: make dashboard-install

      - name: Install python-client deps
        run: make python-client-install

      # Database strategy: we deliberately do NOT use a `services:` Postgres
      # container. Instead `make test` has `dev-db-up` as a hard Make
      # prerequisite, bringing up `pgvector/pgvector:pg17` on 127.0.0.1:55434
      # via docker compose. Reasons:
      #   1. The server uses pgvector for vector search; a plain `postgres:17`
      #      service container would fail vector-search tests.
      #   2. The dev compose file tunes the instance (max_connections=300 for
      #      the ~20 concurrent test binaries) and `--wait` blocks until the
      #      pg_isready healthcheck passes.
      #   3. `docker compose` v2 is preinstalled on ubuntu-latest.
      # nextest: `make test` prefers `cargo nextest run` (per-test processes +
      # retry quotas, .config/nextest.toml) and falls back to `cargo test` when
      # absent — this step is what makes the nextest branch the one CI takes.
      # SEC-138: pinned to the v2.87.28 tag's commit, verified to resolve
      # (1168f6810a3cb30a3514bf5756a3b7f0422c6df8). Bump deliberately.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest

      - name: Run make test
        run: make test

  features:
    name: make rust-client-check-features
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Free runner disk space
        uses: ./.github/actions/free-runner-disk

      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      # ARC-110: `make checkall` exercises rust-client only under
      # `--all-features`. This extra gate checks the library AND every test
      # target across meaningful feature combinations, so an ungated feature
      # import in a test (which would compile under --all-features and break
      # every other combo) is caught. The [[test]] required-features in
      # rust-client/Cargo.toml make the per-test gating declarative.
      - name: rust-client feature-combination gate (ARC-110)
        run: make rust-client-check-features

  docs:
    # Heavy artifact tiering: the API references are needed only when they are
    # consumed (the tag-triggered pages publish) or explicitly requested via
    # workflow_dispatch — not on every push.
    name: API references (rust, ts, python)
    needs: [scope]
    if: >-
      contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install ts-client deps
        run: make ts-client-install

      - name: Install python-client deps
        run: make python-client-install

      # On ubuntu the Makefile's `docs-api` reduces to exactly these three
      # targets (swift-client-doc is Darwin-guarded and built in the swift job).
      - name: Build API references
        run: make rust-client-doc ts-client-doc python-client-doc

      - name: Upload Rust API reference
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-api-reference
          path: target/doc

      - name: Upload TypeScript API reference
        uses: actions/upload-artifact@v7.0.2
        with:
          name: typescript-api-reference
          path: ts-client/docs-api

      - name: Upload Python API reference
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-api-reference
          path: python-client/docs-api

  # --- Swift client (macOS runner) ----------------------------------------
  # `swift build`/`swift test` need the Swift 6 toolchain, which ships with the
  # Xcode on macos-latest; swiftformat/swiftlint come from Homebrew (the runner
  # image usually carries both — `brew install` is a fast no-op when it does).
  # Same pinned checkout ref as the ubuntu jobs (SEC-138 discipline: no
  # floating tags).
  swift:
    name: make swift-client-checkall
    needs: [scope]
    if: contains(fromJSON(needs.scope.outputs.os-matrix), 'macos-latest')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install swiftformat & swiftlint
        run: brew install swiftformat swiftlint

      - name: Run make swift-client-checkall
        run: make swift-client-checkall

      # Same artifact tiering as the docs job: DocC + upload only when the
      # reference is consumed (tags) or explicitly requested.
      - name: Generate Swift API reference
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: make swift-client-doc

      - name: Package Swift API reference
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: tar -czf swift-api-reference.tar.gz -C swift-client/docs-api ParRtDbClient.doccarchive

      - name: Upload Swift API reference
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-api-reference
          path: swift-api-reference.tar.gz

  proptest-weekly:
    name: property tests (1000 cases)
    needs: [scope]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RTDB_TEST_DATABASE_URL: postgres://rtdb:rtdb@127.0.0.1:55434/rtdb
      PROPTEST_CASES: '1000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Start dev database
        run: make dev-db-up
      - name: Run property tests
        run: cargo test --manifest-path server/Cargo.toml --all-features --test main proptest_parity

  # ENH-050: weekly coverage artifact, report-only. Runs the FAST legs only
  # (ts-client, dashboard, python, go — seconds each, no Rust, no dev
  # Postgres); the instrumented Rust leg is local-only by policy: CI carries
  # no long-running suites (Paul, 2026-10-12). No thresholds, never part of
  # `make checkall`. Dispatch keeps the same os-scope gate as the other jobs.
  coverage-weekly:
    name: coverage (fast legs, report-only)
    needs: [scope]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go-client/go.sum
      - name: Install go-client deps
        run: make go-client-install
      - name: Install ts-client deps
        run: make ts-client-install
      - name: Install dashboard deps
        run: make dashboard-install
      - name: Install python-client deps
        run: make python-client-install
      - name: Run make coverage-fast
        run: make coverage-fast
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-reports
          path: |
            target/coverage/
            ts-client/coverage/
            dashboard/coverage/
          if-no-files-found: error

  # ENH-051: weekly supply-chain audit across all six ecosystems
  # (`make audit-deps`: cargo audit, bun audit for both bun workspaces,
  # pip-audit, govulncheck, plus a SwiftPM dependency listing). Network-bound
  # (advisory databases), so it runs here on the weekly schedule and on demand
  # via workflow_dispatch — never inside `make checkall`. The Swift advisory gap
  # is inherent: SwiftPM has no advisory database, so Swift gets a listing only.
  deps-audit-weekly:
    name: dependency audit (make audit-deps)
    needs: [scope]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON(needs.scope.outputs.os-matrix), 'ubuntu-latest'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache-dependency-path: go-client/go.sum
      # SEC-138: pinned to an immutable commit SHA. The action ref above pins
      # the installer; this pins the audit scanner itself so a weekly run
      # reproduces the locally-verified verdict. Bump both deliberately.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - name: Run dependency audit
        run: make audit-deps

  pages:
    name: Publish API references
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [drift, lint, typecheck, test, features, docs, swift]
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Rust API reference
        uses: actions/download-artifact@v8.0.2
        with:
          name: rust-api-reference
          path: site/rust
      - name: Download TypeScript API reference
        uses: actions/download-artifact@v8.0.2
        with:
          name: typescript-api-reference
          path: site/ts
      - name: Download Python API reference
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-api-reference
          path: site/python
      - name: Download Swift API reference
        uses: actions/download-artifact@v8.0.2
        with:
          name: swift-api-reference
          path: site/swift
      - name: Unpack Swift DocC archive
        run: |
          tar -xzf site/swift/swift-api-reference.tar.gz -C site/swift
          rm site/swift/swift-api-reference.tar.gz
          cp -R site/swift/ParRtDbClient.doccarchive/. site/swift/
          rm -rf site/swift/ParRtDbClient.doccarchive
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
