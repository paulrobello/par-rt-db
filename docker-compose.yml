# Production stack for lenny2 (standalone Docker, plain compose — not Swarm).
# Secrets come from a sibling .env file (never committed). See .env.example.
# The server publishes on 127.0.0.1:8300 only; the host cloudflared tunnel
# routes rtdb.pardev.net -> localhost:8300.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rtdb
      # Deterministic, versionless collation: `C` collate never carries a libc
      # version, so the cluster is immune to the collation-version-mismatch
      # warning across image/base-OS glibc upgrades (en_US.utf8 drifts with
      # glibc and warns). ctype=C.UTF-8 keeps UTF-8 charset handling. Applied
      # only on a fresh (empty) data volume.
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C.UTF-8"
    volumes:
      - rtdb-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    # SEC-136: the official postgres image already runs the daemon as the
    # non-root `postgres` user (it enters as root only to chown the data dir,
    # then gosu-drops). no-new-privileges is safe for that drop-privilege flow.
    # cap_drop/read_only are deliberately NOT applied here — the first-boot
    # entrypoint needs CAP_CHOWN/CAP_DAC_OVERRIDE to `chown -R postgres $PGDATA`
    # and is not exercised in the build-time verification, so applying them
    # blind risks breaking initdb on a fresh volume. The audit's RCE surface is
    # the server's image-decode path, hardened on the `server` service below.
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: .
      args:
        # Bake the live git sha into /healthz; "unknown" if unset. Set in .env.
        RTDB_BUILD_COMMIT: ${RTDB_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RTDB_PORT: "8300"
      RTDB_DATABASE_URL: postgres://rtdb:${POSTGRES_PASSWORD}@postgres:5432/rtdb
      RTDB_ADMIN_KEY: ${RTDB_ADMIN_KEY:?set RTDB_ADMIN_KEY in .env}
      RTDB_PUBLIC_URL: ${RTDB_PUBLIC_URL:-https://rtdb.pardev.net}
      # Serves the bundled operator console SPA same-origin (baked into the
      # image at /app/dashboard-dist). Override to "" for an API-only deploy.
      RTDB_STATIC_DIR: ${RTDB_STATIC_DIR:-/app/dashboard-dist}
      RTDB_ALLOWED_ORIGINS: ${RTDB_ALLOWED_ORIGINS:-https://projects.pardev.net}
      RTDB_GITHUB_CLIENT_ID: ${RTDB_GITHUB_CLIENT_ID:-}
      RTDB_GITHUB_CLIENT_SECRET: ${RTDB_GITHUB_CLIENT_SECRET:-}
      RTDB_GOOGLE_CLIENT_ID: ${RTDB_GOOGLE_CLIENT_ID:-}
      RTDB_GOOGLE_CLIENT_SECRET: ${RTDB_GOOGLE_CLIENT_SECRET:-}
      RTDB_GITLAB_CLIENT_ID: ${RTDB_GITLAB_CLIENT_ID:-}
      RTDB_GITLAB_CLIENT_SECRET: ${RTDB_GITLAB_CLIENT_SECRET:-}
      RTDB_OIDC_CLIENT_ID: ${RTDB_OIDC_CLIENT_ID:-}
      RTDB_OIDC_CLIENT_SECRET: ${RTDB_OIDC_CLIENT_SECRET:-}
      RTDB_OIDC_AUTHORIZE_URL: ${RTDB_OIDC_AUTHORIZE_URL:-}
      RTDB_OIDC_TOKEN_URL: ${RTDB_OIDC_TOKEN_URL:-}
      RTDB_OIDC_USERINFO_URL: ${RTDB_OIDC_USERINFO_URL:-}
      RTDB_MICROSOFT_CLIENT_ID: ${RTDB_MICROSOFT_CLIENT_ID:-}
      RTDB_MICROSOFT_CLIENT_SECRET: ${RTDB_MICROSOFT_CLIENT_SECRET:-}
      RTDB_MICROSOFT_TENANT: ${RTDB_MICROSOFT_TENANT:-common}
      RTDB_APPLE_CLIENT_ID: ${RTDB_APPLE_CLIENT_ID:-}
      RTDB_APPLE_TEAM_ID: ${RTDB_APPLE_TEAM_ID:-}
      RTDB_APPLE_KEY_ID: ${RTDB_APPLE_KEY_ID:-}
      RTDB_APPLE_PRIVATE_KEY: ${RTDB_APPLE_PRIVATE_KEY:-}
      RTDB_SESSION_TTL_DAYS: ${RTDB_SESSION_TTL_DAYS:-30}
      # Login-CSRF defense (double-submit nonce cookie at OAuth /begin + /callback).
      RTDB_OAUTH_LOGIN_CSRF: ${RTDB_OAUTH_LOGIN_CSRF:-true}
      # Anonymous auth (off by default). Mirrors the .env.example default.
      RTDB_AUTH_ANONYMOUS_ENABLED: ${RTDB_AUTH_ANONYMOUS_ENABLED:-false}
      # SEC-103: short TTL + per-IP rate limit for anonymous sessions so the
      # unauthenticated mint route can't be abused to flood the auth tables.
      RTDB_ANONYMOUS_SESSION_TTL_DAYS: ${RTDB_ANONYMOUS_SESSION_TTL_DAYS:-1}
      RTDB_ANONYMOUS_RATE_LIMIT_PER_IP_RPM: ${RTDB_ANONYMOUS_RATE_LIMIT_PER_IP_RPM:-10}
      # SEC-109: per-IP rate limit on POST /admin/login to bound admin-key
      # brute-force. 0 = unlimited (code default); the shipped default turns
      # the mitigation on out-of-the-box. Each failure also increments the
      # rtdb_admin_auth_failures_total counter and logs at WARN.
      RTDB_ADMIN_RATE_LIMIT_PER_IP_RPM: ${RTDB_ADMIN_RATE_LIMIT_PER_IP_RPM:-10}
      # SEC-120: cookie Secure attribute ships on by default — a misconfigured
      # proxy that strips X-Forwarded-Proto can no longer cause a session cookie
      # to be sent over plain HTTP. Set to "false" ONLY for local-http dev.
      RTDB_COOKIE_SECURE: ${RTDB_COOKIE_SECURE:-true}
      # SEC-201: the shipped deploy sits behind the Cloudflare tunnel, so the
      # forwarding headers (CF-Connecting-IP / X-Forwarded-For /
      # X-Forwarded-Proto) are proxy-observed, not caller-controlled. Set to
      # "false" only when the port is directly reachable.
      RTDB_TRUSTED_PROXY: ${RTDB_TRUSTED_PROXY:-true}
      # Webhook delivery registry (off by default). Mirrors SEC-001 SSRF
      # hardening: when enabled, registration requires https + rejects private
      # IP ranges; RTDB_WEBHOOK_ALLOW_HTTP is the dev escape hatch (off).
      RTDB_WEBHOOKS_ENABLED: ${RTDB_WEBHOOKS_ENABLED:-false}
      RTDB_WEBHOOK_ALLOW_HTTP: ${RTDB_WEBHOOK_ALLOW_HTTP:-false}
      # Durable audit log (off by default). When true the committer writes one
      # rtdb.audit_log row per DocOp at every durable tap site. Mirrors the
      # .env.example default.
      RTDB_AUDIT_LOG_ENABLED: ${RTDB_AUDIT_LOG_ENABLED:-false}
      # Per-IP rate limit on the public storage serve route (SEC-004 / SEC-112).
      # 0 = off. Shipped default is 600 RPM (10/sec) — the on-the-fly image
      # transform path amplifies cost per request, and the route is
      # unauthenticated, so leaving this off invites a cost flood. Set 0 only
      # when an upstream proxy enforces its own per-IP cap.
      RTDB_STORAGE_RATE_LIMIT_PER_IP_RPM: ${RTDB_STORAGE_RATE_LIMIT_PER_IP_RPM:-600}
      # SEC-113: require a valid signed URL on every public storage fetch.
      # false (default) keeps the opaque-id-as-bearer-URL behavior (Convex
      # parity); true makes `?exp=&sig=` mandatory on GET /storage/{id}.
      RTDB_STORAGE_REQUIRE_SIGNED_URLS: ${RTDB_STORAGE_REQUIRE_SIGNED_URLS:-false}
      # NOTE: this `environment:` block is an explicit ALLOWLIST — a key present
      # in `.env` but absent here never reaches the container. Adding a new
      # RTDB_* boot knob means adding a line here too, or it silently keeps its
      # code default in the docker deploy. `make env-drift-check` guards this.
      #
      # Every default below matches the server's own code default, so adding
      # these lines changes nothing for a deploy that doesn't set them.
      RTDB_ADMIN_EMAILS: ${RTDB_ADMIN_EMAILS:-}
      RTDB_MAX_AFFECTED_DOCS: ${RTDB_MAX_AFFECTED_DOCS:-100}
      RTDB_MAX_FILE_SIZE: ${RTDB_MAX_FILE_SIZE:-52428800}
      RTDB_IDEMPOTENCY_TTL_MS: ${RTDB_IDEMPOTENCY_TTL_MS:-300000}
      # Per-database resource quotas (ENH-011). 0 = unlimited.
      RTDB_MAX_TABLES_PER_DB: ${RTDB_MAX_TABLES_PER_DB:-0}
      RTDB_MAX_STORAGE_BYTES_PER_DB: ${RTDB_MAX_STORAGE_BYTES_PER_DB:-0}
      RTDB_MAX_SUBS_PER_DB: ${RTDB_MAX_SUBS_PER_DB:-0}
      # Quota counter cache TTL (0 = no caching).
      RTDB_QUOTA_CACHE_TTL_SECS: ${RTDB_QUOTA_CACHE_TTL_SECS:-60}
      # Idle-database reclamation (ARC-102 step 4). 0 = disabled (default): a
      # db's per-db tasks live for the process once spawned. Non-zero retires a
      # db's tasks after this many idle seconds with no subs and no pending jobs.
      RTDB_DB_IDLE_RECLAIM_SECS: ${RTDB_DB_IDLE_RECLAIM_SECS:-0}
      # OpenTelemetry / OTLP tracing (ENH-018). Forwarded so env-drift-check
      # passes; inert unless the server image was built `--features otel` AND
      # RTDB_OTEL_ENABLED=true. Defaults match the server's code defaults.
      RTDB_OTEL_ENABLED: ${RTDB_OTEL_ENABLED:-false}
      RTDB_OTEL_ENDPOINT: ${RTDB_OTEL_ENDPOINT:-http://127.0.0.1:4317}
      RTDB_OTEL_SERVICE_NAME: ${RTDB_OTEL_SERVICE_NAME:-par-rt-db}
      RTDB_OTEL_SAMPLE_RATIO: ${RTDB_OTEL_SAMPLE_RATIO:-0.05}
      # Cross-instance op-feed fan-out (ENH-022 Stage 2). Off by default —
      # leave false for single-instance deploys (the default topology). When
      # true, durable writes emit one pg_notify per DocOp and a per-process
      # LISTEN task mirrors peer notifications into the local op-feed ring.
      # RTDB_INSTANCE_ID tags NOTIFY payloads for self-dedupe; empty = auto-
      # generated. Defaults mirror the server's code defaults.
      RTDB_MULTI_INSTANCE: ${RTDB_MULTI_INSTANCE:-false}
      RTDB_INSTANCE_ID: ${RTDB_INSTANCE_ID:-}
      RTDB_GITHUB_BASE_URL: ${RTDB_GITHUB_BASE_URL:-https://github.com}
      RTDB_GITHUB_API_URL: ${RTDB_GITHUB_API_URL:-https://api.github.com}
      RTDB_GITLAB_BASE_URL: ${RTDB_GITLAB_BASE_URL:-https://gitlab.com}
      # Shadow-verify 1 subscription-invalidation skip in every N. Ships ON at
      # 1000 (ARC-101); 0 = off.
      RTDB_SUBS_VERIFY_SKIP_EVERY: ${RTDB_SUBS_VERIFY_SKIP_EVERY:-1000}
      # On-the-fly image transforms on storage serve (ENH-014). All optional;
      # defaults mirror the server's code defaults.
      RTDB_IMAGE_TRANSFORMS_ENABLED: ${RTDB_IMAGE_TRANSFORMS_ENABLED:-true}
      RTDB_IMAGE_MAX_DIM: ${RTDB_IMAGE_MAX_DIM:-2048}
      RTDB_IMAGE_MAX_PIXELS: ${RTDB_IMAGE_MAX_PIXELS:-25000000}
      RTDB_IMAGE_CACHE_BYTES: ${RTDB_IMAGE_CACHE_BYTES:-268435456}
      RTDB_IMAGE_CONCURRENCY: ${RTDB_IMAGE_CONCURRENCY:-4}
      RTDB_IMAGE_DEFAULT_QUALITY: ${RTDB_IMAGE_DEFAULT_QUALITY:-80}
      # Realtime presence primitive (ENH-015). All optional; OFF unless the
      # master switch is true. Defaults mirror the server's code defaults.
      RTDB_PRESENCE_ENABLED: ${RTDB_PRESENCE_ENABLED:-true}
      RTDB_PRESENCE_MAX_STATE_BYTES: ${RTDB_PRESENCE_MAX_STATE_BYTES:-1024}
      RTDB_PRESENCE_MAX_ROOM_SIZE: ${RTDB_PRESENCE_MAX_ROOM_SIZE:-100}
      RTDB_PRESENCE_MAX_ROOMS_PER_CONN: ${RTDB_PRESENCE_MAX_ROOMS_PER_CONN:-32}
      RTDB_PRESENCE_MAX_ROOM_BYTES: ${RTDB_PRESENCE_MAX_ROOM_BYTES:-256}
      RTDB_PRESENCE_BROADCAST_INTERVAL_MS: ${RTDB_PRESENCE_BROADCAST_INTERVAL_MS:-50}
      RTDB_PRESENCE_UPDATE_LIMIT_PER_SEC: ${RTDB_PRESENCE_UPDATE_LIMIT_PER_SEC:-20}
      # Upper bound on a client-supplied presenceState ttlMs (over-cap is
      # rejected, not clamped). Mirrors the server's code default.
      RTDB_PRESENCE_MAX_TTL_MS: ${RTDB_PRESENCE_MAX_TTL_MS:-300000}
      # ENH-022 Stage 3 — cross-instance presence gossip (only active when
      # RTDB_MULTI_INSTANCE=true). Beat interval + eviction timeout for the
      # peer shadow map; inert in single-instance mode.
      RTDB_PRESENCE_BEAT_INTERVAL_MS: ${RTDB_PRESENCE_BEAT_INTERVAL_MS:-5000}
      RTDB_PRESENCE_BEAT_TIMEOUT_MS: ${RTDB_PRESENCE_BEAT_TIMEOUT_MS:-15000}
      # Postgres connection-pool ceiling. Multi-tenant default (75): the
      # committer-per-db model holds a connection per active db during fan-out,
      # so the pool must scale with the number of active databases.
      RTDB_POOL_MAX_CONNECTIONS: ${RTDB_POOL_MAX_CONNECTIONS:-75}
      # In-memory pushed-schema cache bound (ARC-119). Entry-count cap on the
      # per-process SchemaCache; LRU-evicted past the cap and transparently
      # reloaded from Postgres. 0 = unbounded; default 1024 bounds a
      # multi-tenant instance that creates and drops databases over time.
      RTDB_SCHEMA_CACHE_MAX_ENTRIES: ${RTDB_SCHEMA_CACHE_MAX_ENTRIES:-1024}
      # Slow-query log (ENH-019). 0 ms = disabled (default); non-zero lands any
      # query over the threshold into the bounded ring at GET /admin/slow-queries.
      # Defaults mirror the server's code defaults.
      RTDB_SLOW_QUERY_MS: ${RTDB_SLOW_QUERY_MS:-0}
      RTDB_SLOW_QUERY_CAPACITY: ${RTDB_SLOW_QUERY_CAPACITY:-200}
      RTDB_SLOW_QUERY_LOG_PARAMS: ${RTDB_SLOW_QUERY_LOG_PARAMS:-false}
      # HTTP rate limiting (fixed-window, in-memory). 0 = unlimited (default).
      # Per-machine-token caps each token; per-db is shared across all principals
      # of one database. OAuth sessions carry no token id and are rate-limited
      # per-db only.
      RTDB_RATE_LIMIT_PER_TOKEN_RPM: ${RTDB_RATE_LIMIT_PER_TOKEN_RPM:-0}
      RTDB_RATE_LIMIT_PER_DB_RPM: ${RTDB_RATE_LIMIT_PER_DB_RPM:-0}
      # Document TTL reaper. Sweep cadence per db and rows deleted per
      # table per sweep. Best-effort, boot-only. Defaults mirror the server.
      RTDB_TTL_SWEEP_INTERVAL_SECS: ${RTDB_TTL_SWEEP_INTERVAL_SECS:-60}
      RTDB_TTL_BATCH: ${RTDB_TTL_BATCH:-5000}
      # Managed pg_dump backup scheduler (off by default). Flip RTDB_BACKUP_ENABLED
      # to true for daily 03:00 UTC dumps into RTDB_BACKUP_DIR, keeping the newest
      # RTDB_BACKUP_RETENTION. The docker image installs postgresql-client so
      # pg_dump is present. See deploy/README.md §Backups.
      RTDB_BACKUP_ENABLED: ${RTDB_BACKUP_ENABLED:-false}
      RTDB_BACKUP_CRON: ${RTDB_BACKUP_CRON:-0 3 * * *}
      RTDB_BACKUP_DIR: ${RTDB_BACKUP_DIR:-./backups}
      RTDB_BACKUP_RETENTION: ${RTDB_BACKUP_RETENTION:-7}
      RUST_LOG: ${RUST_LOG:-info}
    # SEC-136: container hardening for the RCE surface (the image-decode path).
    # read_only rootfs — the server's only runtime disk writes are temp files
    # (/tmp) and the backup dump dir; both are writable tmpfs below. Everything
    # else (moka cache, blobs, audit, webhooks) lives in Postgres or in memory.
    # cap_drop ALL + no-new-privileges: the server binds 8300 (>1024, no cap
    # needed) and never escalates; the non-root USER is set in the Dockerfile.
    read_only: true
    tmpfs:
      # tokio/TLS temp files + pg_dump scratch space under a read-only rootfs.
      - /tmp:rw,noexec,nosuid,nodev
      # Default backup dir: RTDB_BACKUP_DIR defaults to ./backups, which at the
      # container's CWD (/) resolves to /backups. tmpfs is RAM-backed: operators
      # enabling RTDB_BACKUP_ENABLED for *retained* dumps must replace this tmpfs
      # with a named/bind volume at their backup path (the persistence gap is
      # pre-existing — the container writable layer was never retained either).
      - /backups:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8300:8300"

volumes:
  rtdb-pg:
