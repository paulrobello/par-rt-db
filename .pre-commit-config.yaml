repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      # ARC-014: run cargo fmt/clippy directly (workspace-level) instead of
      # `make fmt`/`make lint`, which also sweep ts-client, dashboard, and
      # python-client on every Rust-only commit.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
      # ARC-014: biome + ruff ran only in CI; add local hooks scoped to the
      # files each tool owns. Each hook runs that client's lint + format-check
      # so a typo'd file is caught at `git commit`, not at `make checkall` or
      # in CI. `make fmt`/`make lint` already include these, but those targets
      # run every package on every Rust commit, so a TS/Python-only commit
      # would otherwise skip them (the cargo-fmt/clippy hooks above are now
      # scoped to `files: \.rs$` the same way).
      - id: biome-ts-client
        name: biome (ts-client)
        entry: bash -c 'cd ts-client && bun run lint && bun run fmt-check'
        language: system
        files: ^ts-client/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: biome-dashboard
        name: biome (dashboard)
        entry: bash -c 'cd dashboard && bun run lint && bun run fmt-check'
        language: system
        files: ^dashboard/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: ruff-python-client
        name: ruff (python-client)
        entry: bash -c 'cd python-client && uv run ruff check . && uv run ruff format --check .'
        language: system
        files: ^python-client/.*\.py$
        pass_filenames: false
