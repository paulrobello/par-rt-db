[package]
name = "rtdb-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
# HMAC-SHA256 backend for signed storage URLs (signed_url module). Already
# compiled transitively via rustls (sqlx `tls-rustls`, reqwest `rustls-tls`);
# naming it directly adds no new native build.
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
base64 = "0.22"
# Sign in with Apple (ENH-001): Apple rejects a static client_secret, so the
# secret sent to Apple's token endpoint is a short-lived ES256 JWT the server
# signs with the registered EC private key. 9.x uses `ring` (already in the
# tree via rustls) as its sole crypto backend — no new native build.
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
croner = "2"
# Used by the managed-backup task to parse `postgres://` connection strings
# into PG* env vars (so credentials never appear in the child argv).
url = "2"
# Decodes percent-encoded user/password/database in the connection string
# (`url::Url::username` etc. return encoded values); same crate `url` already
# pulls in transitively.
percent-encoding = "2"
# On-the-fly image transforms on storage serve (ENH-014): `image` decodes +
# re-encodes served blobs (default features off, only the codecs we serve);
# `moka` is the LRU result cache keyed by (blob id, transform params).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
wiremock = "0.6"

# Match cli/ and rust-client/: a direct `cargo clippy`/`cargo build` (editor,
# rust-analyzer, pre-commit) denies warnings without needing the Makefile's
# `-D warnings` flag. The Makefile's `make lint`/`make checkall` already pass
# `-D warnings` so this is belt-and-suspenders, not a behavior change.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
