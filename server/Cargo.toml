[package]
name = "rtdb-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
# ARC-010: one integration-test binary instead of one per file. Auto-discovery
# would still make every `tests/*.rs` its own target, so it is off and the
# single target is declared explicitly; `tests/main.rs` declares each file as a
# module.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[features]
# Default build carries no OpenTelemetry code (ENH-018). `otel` pulls in the
# OTLP exporter + tracing-opentelemetry bridge; the subscriber layer in main.rs
# is cfg-gated on it, and RTDB_OTEL_ENABLED gates it again at runtime so a
# feature-compiled binary still makes zero OTLP calls unless an operator opts
# in. The opentelemetry / tracing-opentelemetry version matrix is pinned (see
# the dep lines) because that pairing breaks across minor versions — verified
# to resolve together via `cargo tree -d` (no duplicate opentelemetry tree).
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# ENH-029 multi-instance test harness: the chaos hooks in `src/forward.rs`
# (`drop_replies` / `delay_listener`) and their reachability path
# (`Committers::forwarder`) are cfg-gated on `any(test, feature =
# "test-support")`. `cfg(test)` covers the lib's own unit tests only — an
# integration test binary is a separate crate, so `tests/common/cluster.rs`
# needs the feature enabled on the lib when the test binary is built:
# `cargo test --features test-support`. No new dependencies — the flag only
# compiles in code that is already reachable from the dev-dependency graph.
test-support = []

[dependencies]
par-rt-db-core.workspace = true
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
# `std` re-adds sha2's default features (the workspace base ships
# default-features = false so rust-client can stay minimal); this matches the
# pre-workspace `sha2 = "0.10"` behavior exactly.
sha2 = { workspace = true, features = ["std"] }
hex = "0.4"
rand = "0.8"
subtle = "2"
# HMAC-SHA256 backend for signed storage URLs (signed_url module). Already
# compiled transitively via rustls (sqlx `tls-rustls`, reqwest `rustls-tls`);
# naming it directly adds no new native build.
ring = "0.17"
reqwest = { workspace = true, features = ["cookies"] }
base64.workspace = true
# Sign in with Apple (ENH-001): Apple rejects a static client_secret, so the
# secret sent to Apple's token endpoint is a short-lived ES256 JWT the server
# signs with the registered EC private key. 9.x uses `ring` (already in the
# tree via rustls) as its sole crypto backend — no new native build.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
croner = "2"
# Used by the managed-backup task to parse `postgres://` connection strings
# into PG* env vars (so credentials never appear in the child argv).
url = "2"
# Decodes percent-encoded user/password/database in the connection string
# (`url::Url::username` etc. return encoded values); same crate `url` already
# pulls in transitively.
percent-encoding = "2"
# On-the-fly image transforms on storage serve (ENH-014): `image` decodes +
# re-encodes served blobs (default features off, only the codecs we serve);
# `moka` is the LRU result cache keyed by (blob id, transform params).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
moka = { version = "0.12", features = ["future"] }
# Streaming storage upload/download (ENH-021): the upload path consumes the
# request body as a generic `futures::Stream<Item = Result<Bytes, _>>`, and the
# download path builds an axum `Body::from_stream` over the chunk stream.
futures = { workspace = true }
# `ReceiverStream` adapts a tokio mpsc receiver into a `Stream` for the
# streaming download path (ENH-021): a background task drains the chunk rows
# and forwards each over a channel, so a 1 GiB download never materializes.
tokio-stream = "0.1"
# OpenTelemetry / OTLP tracing export (ENH-018). Optional + feature-gated behind
# `otel` (default off). The exact versions are pinned because the
# opentelemetry / tracing-opentelemetry pairing breaks across minor versions
# more often than most crates — 0.31.x + tracing-opentelemetry 0.32.x is the
# verified-resolving matrix (checked with `cargo tree -d`, no duplicate tree).
# The 0.31 API renames `TracerProvider` → `SdkTracerProvider`, drops the runtime
# arg from `with_batch_exporter`, and replaces `Resource::new` with a builder —
# the pre-0.27 sketch in the plan doc no longer compiles.
opentelemetry = { version = "0.31", default-features = false, optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "trace",
    "rt-tokio",
], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "trace",
    "grpc-tonic",
], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
anyhow.workspace = true
tempfile = "3"
tokio-tungstenite.workspace = true
futures-util.workspace = true
wiremock.workspace = true
serial_test = "3"
# RS256 signing in the `auth/microsoft.rs` id_token unit tests: throwaway
# runtime-generated keys (never a PEM/key literal in the repo, so gitleaks
# stays meaningful). 0.9 is already in the tree via jsonwebtoken's rust_crypto
# backend — declaring it adds no new crates to the build.
rsa = "0.9"
# ENH-027 property-based parity testing (`tests/proptest_parity.rs`):
# generative schemas/docs/queries executed against both Postgres (this crate)
# and the rust-client in-memory engine, asserting identical results. Both are
# server-only for now, so they live here rather than in the root
# `[workspace.dependencies]` table (whose convention reserves it for deps
# shared by two or more members — same precedent as `tempfile`/`serial_test`).
# The path dev-dep pulls `in_memory` (which only adds `sha2`, already in the
# tree via this crate's own dependency); its default `http` feature reuses the
# reqwest already compiled for the server.
proptest = "1"
par-rt-db-client = { path = "../rust-client", features = ["in_memory", "admin"] }
# ENH-033: criterion micro-benchmarks over the pure hot paths (query compile,
# computed-field eval, doc validation, migration planning) — no Postgres.
criterion.workspace = true

[[bench]]
name = "compile_query"
harness = false

[[bench]]
name = "value_expr"
harness = false

[[bench]]
name = "validate_doc"
harness = false

[[bench]]
name = "migrate_validate"
harness = false

# Match cli/ and rust-client/: a direct `cargo clippy`/`cargo build` (editor,
# rust-analyzer, pre-commit) denies warnings without needing the Makefile's
# `-D warnings` flag. The Makefile's `make lint`/`make checkall` already pass
# `-D warnings` so this is belt-and-suspenders, not a behavior change.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
