[package]
name = "rtdb-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
croner = "2"
# Used by the managed-backup task to parse `postgres://` connection strings
# into PG* env vars (so credentials never appear in the child argv).
url = "2"
# Decodes percent-encoded user/password/database in the connection string
# (`url::Url::username` etc. return encoded values); same crate `url` already
# pulls in transitively.
percent-encoding = "2"

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
wiremock = "0.6"
