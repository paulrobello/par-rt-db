[package]
name = "par-rt-db-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Rust client for par-rt-db (HTTP + reactive WebSocket)"
repository = "https://github.com/paulrobello/par-rt-db"

[features]
default = ["http"]
http = ["dep:reqwest"]
ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
admin = ["http"]
in_memory = ["dep:sha2"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

# ARC-110: declare each test binary's feature dependencies so `cargo check
# --all-targets` (what `cargo test` builds) compiles under every feature
# combination, not only `--all-features`. Without these, an ungated import
# (e.g. `in_memory` items in golden_vector, `HotConfig`/`HotConfigPatch` in
# hot_config_test, or `reqwest::Client` via `tests/common/mod.rs` in
# ws_integration) breaks every combination except the full feature set, and
# neither `make` nor CI would notice — they only ever pass `--all-features`.
[[test]]
name = "golden_vector"
required-features = ["in_memory"]

[[test]]
name = "query_combinations"
required-features = ["in_memory"]

[[test]]
name = "hot_config_test"
required-features = ["admin"]

[[test]]
name = "ws_integration"
required-features = ["ws", "http"]
