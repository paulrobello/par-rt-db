[package]
name = "rtdb-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Operator + CI CLI for par-rt-db (wraps the rust-client)"
repository = "https://github.com/paulrobello/par-rt-db"

[[bin]]
name = "rtdb"
path = "src/main.rs"

[dependencies]
# `ws` powers `rtdb watch` (the reactive subscribe); `signal` powers its
# Ctrl-C arm. Both are declared here rather than leaned on via workspace
# feature unification, so a standalone build of this crate still compiles.
par-rt-db-client = { path = "../rust-client", features = ["http", "admin", "ws", "in_memory"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
serde_json.workspace = true
anyhow.workspace = true

# QA-019: opt-in live-server integration tests in tests/live.rs drive the
# `rtdb` binary end-to-end the way an operator/CI script would.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# The `ops watch` reconnect tests stand up an in-process WebSocket server, so
# the tail is exercised across a dropped connection without a live par-rt-db.
# `net`/`io-util` are declared here rather than leaned on via feature
# unification with tokio-tungstenite.
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[[test]]
name = "live"
path = "tests/live.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
