[package]
name = "rtdb-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Operator + CI CLI for par-rt-db (wraps the rust-client)"
repository = "https://github.com/paulrobello/par-rt-db"

[[bin]]
name = "rtdb"
path = "src/main.rs"

[dependencies]
par-rt-db-client = { path = "../rust-client", features = ["http", "admin"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
