[package]
name = "rtdb-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Paul Robello <probello@gmail.com>"]
description = "Operator + CI CLI for par-rt-db (wraps the rust-client)"
repository = "https://github.com/paulrobello/par-rt-db"

[[bin]]
name = "rtdb"
path = "src/main.rs"

# ARC-131: tokio powers `#[tokio::main]` + the async `RtDbHttpClient`. Default-on
# `runtime` feature preserves the shipped behavior; disabling it lets a downstream
# that brings its own executor drop the dep.
[features]
default = ["runtime"]
runtime = ["dep:tokio"]

[dependencies]
par-rt-db-client = { path = "../rust-client", features = ["http", "admin"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], optional = true }
serde_json.workspace = true
anyhow.workspace = true

# QA-019: opt-in live-server integration tests in tests/live.rs drive the
# `rtdb` binary end-to-end the way an operator/CI script would.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[test]]
name = "live"
path = "tests/live.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
